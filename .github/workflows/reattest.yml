name: Re-attest release assets

# One-shot repair: artifact attestations did not survive the GitHub repo
# transfer (the signing cert SAN still names the old repo path), so
# `gh attestation verify --repo ciryanna/capto-ffmpeg` 404s. This downloads a
# published release's binaries and re-attests them under the current repo so
# downstream verification works again for the same SHA-256 digests.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to re-attest"
        required: true
        default: "v1.0.0-n9.0"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --pattern "ffmpeg-windows-*.exe" --dir .
          sha256sum ffmpeg-windows-*.exe

      - name: Attest x86_64
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ffmpeg-windows-x86_64.exe

      - name: Attest aarch64
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ffmpeg-windows-aarch64.exe
